# 修改后重启服务；所有 ${NAME} 都从环境变量或根目录 .env 读取，环境变量优先。
# 不支持局部字符串插值；API Key 不要直接写在 YAML。缺失字段或未知字段会校验失败。
# Chat 通用字段（下面六个模型块同义，可分别配置连接；当前共用百炼连接）：
# platform：必填 deepseek / bailian / openai，选择协议而非 tokenizer。
# base_url/api_key：必填连接地址/密钥；URL 不加 /chat/completions。
# model：必填服务端模型 ID；平台、URL、Key、ID 必须匹配。
# temperature：必填非负浮点数，越低越稳定；可用上限及思考模式行为由平台决定。
# timeout_seconds：单次请求超时秒数，>0；max_retries：失败后的额外重试次数，整数>=0。
# context_window_tokens：正整数，输入+输出总窗口，必须按实际模型能力填写，非无限输出。
# compaction_trigger_ratio：默认0.90，0<值<1；输入超此窗口比例触发控制器处理。
# tokenizer：计数器注册名称，当前 DeepSeek / utf8；前者缺本地资源会估算兜底。
# enable_thinking：默认false；平台适配层转换为各厂商参数，不同于开启工具调用。
# structured_output_mode：可取 prompt_only / json_object / json_schema；当前业务统一用
# prompt_only（提示词约束JSON+代码校验），Agent仍用原生tool call，不要求每轮吐JSON。
# 固定 max_output_tokens 与 context_window_tokens 二选一；五个业务模型用窗口模式，
# parser_vision_model 暂用固定输出上限。窗口/计数/限流与检索片段长度是不同概念。

# 规则 Agent 每个阅读批次最多调用次数，整数>=2，默认8；最后一次不提供工具。
# 压缩续跑不清零，正常换批重置。
rule_agent_max_steps: 8
# 资料入库同上，整数>=2，默认8。
evidence_ingestion_max_steps: 8

# 四类业务Agent共用的轻量沙箱：代码预检后在独立Python进程执行，不依赖Docker。
# macOS/Linux；只开放内存数据处理，非任意敌对代码的强安全边界。
python_tool:
  enabled: true
  timeout_seconds: 5
  # Linux虚拟内存上限；macOS不支持同等硬限制，此值不在macOS强制执行。
  memory_mb: 256
  max_code_bytes: 131072
  max_output_bytes: 16384
  # 同一后端进程四类调用方共享，不占用模型请求名额。
  max_concurrency: 2

# 文件调度和实际模型请求使用不同名额，等待子 Agent 时释放模型请求名额。
audit:
  # 主审核每个阅读批次的模型调用轮数，正整数，默认8；含最后无工具收尾轮。
  # 同批压缩续跑不清零，一轮可调用多个工具；不再读取旧的轮次环境变量。
  bid_agent_max_steps: 15
  # 资料核验子 Agent 每个会话的模型调用轮数，正整数，默认4；3个工具轮＋1个无工具收尾轮。
  evidence_agent_max_steps: 4
  # 同一审核任务同时处理文件数，整数>=1，默认2；不等于模型HTTP并发数。
  file_concurrency: 2
  # 审核Chat共享的请求名额，整数>=1，默认3；不控制Embedding/Rerank并发。
  model_concurrency: 3

# 规则库总条数上限预留值，正整数，默认10000，用于当前近似不限制的试运行。
# 整批增量超过上限时调用预留处理函数，当前只打印警告，不拒绝、截断或自动合并。
rule_limit: 10000

# 招标规则抽取 Agent：按需检索、看图，以工具增量保存 RuleSet。
# 六类 Chat 当前使用百炼 deepseek-v4.1-flash；原 DS 官方环境变量保留作切回备用。
# 切回时将 platform 改为 deepseek、model 改为 deepseek-flash，
# URL/Key 恢复各角色原有的 *_MODEL_BASE_URL / *_MODEL_API_KEY 引用。
rule_extraction_model:
  # 平台协议显式选择：deepseek（官方）、bailian（百炼兼容接口）、openai（官方）。
  # 切换时同步修改 platform/model 和 .env 中的 URL/Key；tokenizer 独立选择。
  platform: bailian
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  # 百炼阿里云直供模型 ID，不使用 DS 官方的 deepseek-flash 别名。
  model: deepseek-v4.1-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  # 每次模型调用前由输入控制器计算真实请求预算。
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  # Agent 使用原生工具调用；收尾仅普通文本，不强制整库 JSON。
  enable_thinking: false
  # 保留通用模型配置；规则 Agent 不调用一次性结构化抽取接口。
  structured_output_mode: prompt_only

# 资料入库 Agent：沿用配置名称，产出文件双摘要及跨文件关联。
evidence_classification_model:
  platform: bailian
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  model: deepseek-v4.1-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  enable_thinking: false
  structured_output_mode: prompt_only

# 项目相关性路由模型：仅输出状态和理由，不生成投标摘要。
bid_summary_model:
  platform: bailian
  # 当前共用百炼连接；仍可单独改为其他角色连接变量。
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  model: deepseek-v4.1-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  enable_thinking: false
  structured_output_mode: prompt_only

# 主审核 Agent 模型：一次审核当前投标文件的全部最终规则并按需调用工具。
bid_chat_model:
  platform: bailian
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  model: deepseek-v4.1-flash
  temperature: 0.2
  timeout_seconds: 120
  max_retries: 2
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  enable_thinking: false
  structured_output_mode: prompt_only

# 资料核验子 Agent 模型：针对主 Agent 派发的任务核验资料，轮数由 audit.evidence_agent_max_steps 配置。
evidence_chat_model:
  platform: bailian
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  model: deepseek-v4.1-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  enable_thinking: false
  structured_output_mode: prompt_only

# 公共解析阶段的视觉辅助；不是 view_image 工具或业务 Agent 的模型配置。
parser_vision_model:
  platform: bailian
  base_url: ${BAILIAN_CHAT_BASE_URL}
  api_key: ${BAILIAN_CHAT_API_KEY}
  # 此型号支持图片；原 PARSER_VISION_MODEL_* 环境配置保留，切回时恢复引用。
  model: deepseek-v4.1-flash
  temperature: 0
  timeout_seconds: 120
  max_retries: 2
  # 仅此解析模型使用固定输出上限，正整数；16384不是整个上下文长度。
  max_output_tokens: 16384
  enable_thinking: false
  structured_output_mode: prompt_only

parsing:
  # bool，默认false；prepare_document调用方显式参数优先；开启须配置独立视觉模型。
  vision_enabled: true
  # 单张原始图片字节/像素资源上限，正整数（默认20MB十进制 / 4000万像素）。
  max_image_bytes: 20000000
  max_image_pixels: 40000000
  # 发送视觉模型前图片最长边像素，256~8192，默认2048；非OCR置信度或Token预算。
  vision_image_max_side: 2048
  # PDF基础渲染DPI，72~300，默认120；越大越清晰也越耗内存。
  pdf_render_dpi: 120
  # 图片区域自适应提高清晰度的DPI上限，72~600，默认300；建议不低于基础DPI。
  pdf_render_max_dpi: 300
  # 单PDF页数上限，正整数，默认1000；超限拒绝而非只解析前1000页。
  max_pdf_pages: 1000
  # 单工作表检查的单元格规模上限，正整数，默认500000，防止巨型空白范围撑爆内存。
  max_sheet_cells: 500000
  # 嵌入附件/压缩包的递归深度、成员数量和累计展开字节上限。
  # 仅防止压缩炸弹与异常递归，不是模型输入/检索的文本裁剪预算；超限明确提示未展开。
  max_embedded_depth: 8
  max_embedded_files: 100
  max_embedded_bytes: 100000000

# 文本向量模型：为规则来源、投标文件和投标方资料生成 Embedding。
embedding_model:
  # 必填 local / bailian；local=OpenAI兼容HTTP，bailian=百炼原生文本向量HTTP。
  platform: bailian
  # 百炼控制台对应地域/工作空间的 API Host + /api/v1，不是 /compatible-api/v1。
  base_url: ${EMBEDDING_BASE_URL}
  # 使用该服务所属地域与工作空间的Key；与Chat Key独立配置，可以填同一个获授权Key。
  api_key: ${EMBEDDING_API_KEY}
  # 已登记：qwen3.7-text-embedding / qwen3.7-text-embedding-flash / text-embedding-v4。
  # 前两者每请求最多20条、单条128000 Token；v4最多10条、单条8192 Token。
  model: qwen3.7-text-embedding
  # 正整数；3.7支持256/512/768/1024/1536/2048/2560，flash支持前四种，
  # v4支持64/128/256/512/768/1024/1536/2048。云端发送dimension并校验响应。
  # 平台/地址/模型/维度改变后旧向量不能复用；用新材料正常入库，不自动删改历史数据。
  dimension: 1024
  # 必填正整数，且不超过型号批量上限；先16，切换v4须同时调成<=10。
  batch_size: 16
  # 请求超时秒数>0、额外重试数>=0；网络/限流/部分服务错误重试，鉴权/余额错误不重试。
  timeout_seconds: 120
  max_retries: 2
  # 同事件循环中该云端服务共享HTTP并发名额，整数>=1，默认2；local暂不使用此限流器。
  max_concurrency: 2

# 文本重排：候选仍在本地向量/关键词索引召回；只将候选文本交给远端评分。
rerank_model:
  # 必填local / bailian；与Embedding独立选择，不靠URL猜测，也不自动切回本地。
  platform: bailian
  base_url: ${RERANK_BASE_URL}  # 必填云端API Host + /api/v1，不能填Chat完整路径。
  api_key: ${RERANK_API_KEY}  # 必填云端Key；不要直接写入本文件。
  # 原生协议当前仅此型号；qwen3-rerank使用不同协议，不可直接替换名字。
  model: qwen3.7-text-rerank
  timeout_seconds: 120  # 秒，>0，默认120；不是整场审核超时。
  max_retries: 2  # 额外重试次数>=0，默认2；有限重试，不重试鉴权/欠费。
  max_concurrency: 2  # 云端共享并发请求数>=1，默认2；不影响本地权重推理。
  # 最终保留数>0；调用方传top_n时覆盖此默认值，检索链使用retrieval.final_top_k。
  # HTTP层取每批全部分数后按原始候选ID合并排序，再截取最终数量。
  top_n: 10
  # 任务说明字符串，必填；云端映射为instruct，本地作为查询指令。
  instruction: >-
    Given an electric power tender review requirement, rank the document
    passages by how directly and completely they provide evidence for the
    requirement.
  # bool，云端默认false、本地默认true；true允许记录警告后使用初召回顺序，
  # 不是换用本地模型。false时失败明确上抛，避免误以为重排成功。
  allow_degradation: false

# 切回本地：替换对应块（不要创建重复YAML键），同步.env地址并重启服务。
# 两个职责可以独立选择；本地不会请求百炼、也不需要百炼Key。
