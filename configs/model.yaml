# 规则 Agent 每个阅读批次最多调用次数；压缩续跑不清零，最后一次不提供工具。
rule_agent_max_steps: 8

# 规则库总条数上限预留值，10000 用于当前近似不限制的试运行。
# 整批增量超过上限时调用预留处理函数，当前只打印警告，不拒绝、截断或自动合并。
rule_limit: 10000

# 招标规则抽取 Agent：按需检索、看图，以工具增量保存 RuleSet。
rule_extraction_model:
  # 平台协议显式选择：deepseek（官方）、bailian（百炼兼容接口）、openai（官方）。
  # 切换时同步修改 platform/model 和 .env 中的 URL/Key；tokenizer 独立选择。
  platform: deepseek
  base_url: ${RULE_EXTRACTION_MODEL_BASE_URL}
  api_key: ${RULE_EXTRACTION_MODEL_API_KEY}
  # DeepSeek 官方模型 ID。
  model: deepseek-v4-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  # 仅规则 Agent 接入输入控制器；其他角色仍保留原有输出额度。
  context_window_tokens: 1000000
  compaction_trigger_ratio: 0.90
  tokenizer: DeepSeek
  # Agent 使用原生工具调用；收尾仅普通文本，不强制整库 JSON。
  enable_thinking: false
  # 保留通用模型配置；规则 Agent 不调用一次性结构化抽取接口。
  structured_output_mode: prompt_only

# 投标方资料分类模型：识别合同、发票、证书、技术参数等资料类型。
evidence_classification_model:
  platform: deepseek
  base_url: ${EVIDENCE_CLASSIFICATION_MODEL_BASE_URL}
  api_key: ${EVIDENCE_CLASSIFICATION_MODEL_API_KEY}
  model: deepseek-v4-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  max_output_tokens: 4096
  enable_thinking: false
  structured_output_mode: prompt_only

# 投标文件详细摘要与项目相关性路由模型：每个投标文件进入索引前调用一次。
bid_summary_model:
  platform: deepseek
  # 独立配置 URL 和 Key，允许与主审核 Agent 分别切换模型服务或账号。
  base_url: ${BID_SUMMARY_MODEL_BASE_URL}
  api_key: ${BID_SUMMARY_MODEL_API_KEY}
  model: deepseek-v4-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  max_output_tokens: 8192
  enable_thinking: false
  structured_output_mode: prompt_only

# 主审核 Agent 模型：一次审核当前投标文件的全部最终规则并按需调用工具。
bid_chat_model:
  platform: deepseek
  base_url: ${BID_CHAT_MODEL_BASE_URL}
  api_key: ${BID_CHAT_MODEL_API_KEY}
  model: deepseek-v4-flash
  temperature: 0.2
  timeout_seconds: 120
  max_retries: 2
  # 规则审核结论需要足够的完整 JSON 输出空间，输入规模仍需实际验证。
  max_output_tokens: 16384
  enable_thinking: false
  structured_output_mode: prompt_only

# 资料核验子 Agent 模型：针对主 Agent 传入的精确 Claim，在最多三轮内核验资料。
evidence_chat_model:
  platform: deepseek
  base_url: ${EVIDENCE_CHAT_MODEL_BASE_URL}
  api_key: ${EVIDENCE_CHAT_MODEL_API_KEY}
  model: deepseek-v4-flash
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2
  max_output_tokens: 4096
  enable_thinking: false
  structured_output_mode: prompt_only

# 公共解析阶段的视觉辅助；不是 view_image 工具或业务 Agent 的模型配置。
parser_vision_model:
  platform: deepseek
  base_url: ${PARSER_VISION_MODEL_BASE_URL}
  api_key: ${PARSER_VISION_MODEL_API_KEY}
  # 必须填写实际网关暴露的多模态模型 ID，不猜测服务端名称。
  model: ${PARSER_VISION_MODEL_NAME}
  temperature: 0
  timeout_seconds: 120
  max_retries: 2
  max_output_tokens: 16384
  enable_thinking: false
  structured_output_mode: prompt_only

parsing:
  # 统一 prepare_document 入口；调用方显式参数优先，不传则使用此开关。
  vision_enabled: false
  max_image_bytes: 20000000
  max_image_pixels: 40000000
  vision_image_max_side: 2048
  pdf_render_dpi: 120
  # 嵌入图片区域按原图像素提高渲染分辨率，仍保留叠字/裁切；上限控制内存。
  pdf_render_max_dpi: 300
  max_pdf_pages: 1000
  max_sheet_cells: 500000

# 文本向量模型：为规则来源、投标文件和投标方资料生成 Embedding。
embedding_model:
  base_url: ${EMBEDDING_BASE_URL}
  api_key: ${EMBEDDING_API_KEY}
  # 该名称需要与 llama.cpp 启动时暴露的模型名一致。
  model: text-embedding-v4
  # Qwen3-Embedding-0.6B 原生输出 1024 维。此处只用于响应校验和索引清单，
  # 不会作为 dimensions 参数发送给不支持该参数的 llama.cpp 服务。
  # 修改模型、URL 或维度后必须删除旧索引并全量重建。
  dimension: 1024
  # 0.6B Q4 模型内存占用较低，先使用 16；服务不稳定时再降为 8 或 4。
  batch_size: 16
  timeout_seconds: 120
  max_retries: 2

# 本地重排序模型：在后端进程内对向量和关键词初召回结果进行相关性重排。
# 模型不会在服务启动时加载，第一次实际检索时才懒加载。
rerank_model:
  # 魔塔模型 ID；若 model 填写的是已存在的本地目录，会直接使用本地文件。
  model: Qwen/Qwen3-Reranker-0.6B
  # modelscope：首次使用时从魔塔下载并复用缓存。
  # local：只允许 model 指向已存在的本地目录，适合离线服务器。
  source: modelscope
  # 相对路径固定解析到项目根目录。实际模型位于
  # models/Qwen/Qwen3-Reranker-0.6B，不使用 ~/.cache 临时缓存。
  cache_dir: models
  # auto 自动选择 npu、cuda、mps、cpu；加速设备失败时会自动改用 CPU。
  # 你的 Mac 会优先选择 mps，服务器没有可用加速运行时则直接使用 cpu。
  device: auto
  # auto 在加速设备上使用 float16，在 CPU 上使用 float32。
  dtype: auto
  # Mac 内存较小时建议 2～4；服务器显存充足时可适当增大。
  batch_size: 4
  # 当前片段约 800 token，2048 足够且能控制内存；无需使用模型 32K 上限。
  max_length: 2048
  # 最多保留的重排结果数量。
  top_n: 10
  # 官方建议按具体任务定制 instruction，并优先使用英文。
  instruction: >-
    Given an electric power tender review requirement, rank the document
    passages by how directly and completely they provide evidence for the
    requirement.
  # 使用魔塔缓存且禁止联网时可设为 true；完全离线部署更建议 source=local。
  local_files_only: false
  # Rerank 不可用时是否退回初召回顺序，避免整个审核任务直接失败。
  allow_degradation: true
