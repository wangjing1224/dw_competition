# 修改后重启；分段配置变化只对新建索引生效，不会自动改写旧索引。
# 正整数，正文block切分的近似Token上限；当前使用本地轻量计数，不是Qwen精确分词。
# 1024是试运行起点，不是接口上限。完整表格/图片转写不按此值截断；短段落不自动合并。
chunk_tokens: 1024

# 相邻片段重复保留的 token 数，减少关键信息刚好落在切分边界的问题。
# 整数>=0，必须小于chunk_tokens；只在同一超长正文block内重叠，不跨段落补前文。
chunk_overlap: 160

# 正整数，向量召回和关键词召回各自最多保留的初始候选数量（融合后可能多于30）。
# 调大增加召回范围，也增加Rerank请求开销；不改变Embedding批量。
candidate_top_k: 30

# 正整数，Rerank后每次检索最终数量；检索调用方显式top_k可覆盖。
# 检索链将这个值作为Rerank top_n，每query、每scope生效；工具按查询组去重。
# 返回最终命中的完整片段，不再按字符预算截取；多查询/多scope汇总可能超过此数量。
final_top_k: 10

# 非负浮点数，合并初召回时的向量权重；与关键词权重建议和为1，代码不自动归一化。
semantic_weight: 0.7

# 非负浮点数，合并初召回时的关键词权重；0相当于不贡献该项分数，两项不要都为0。
# 型号、包号、标准号、日期和数值等精确字段主要依赖该召回补充。
keyword_weight: 0.3

# 正整数，单位是字符不是Token：单个普通正文节选/来源quote上限；表格、图片转写的
# content保持完整。公共工具也复用为每查询组正文总预算，放不下整表时会提示未展示，
# 不是整个ToolMessage总长度。只影响回传，不改索引。
# Task32 D1暂时停用，旧值仅留作恢复参考；字段及两层裁剪须配套恢复。
# max_source_chars: 4000
