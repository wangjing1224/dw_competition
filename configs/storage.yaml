# 所有运行时数据的根目录，必填路径字符串。相对路径以项目根目录为基准，
# 不受启动命令当前工作目录影响。
data_root: data

# SQLite 元数据库路径，必填，可绝对或相对项目根目录；不自动跟随data_root拼接，须一起调整。
# 数据库保存项目、投标方、文件、审核任务、审核事件和ID序列；不保存文档全文、
# Embedding向量、完整报告JSON或Word文件，产物在data_root下以文件存储。
database_path: data/app.db

# 三个容量字段均为必填正整数字节数，1 MiB=1024*1024字节，不是MB十进制。
# 单个上传文件最大 100 MiB，流式写入过程中超过限制会立即终止并清理临时文件。
max_upload_bytes: 104857600

# ZIP 中单个解压条目的最大大小 50 MiB，用于限制异常压缩包。
max_zip_entry_bytes: 52428800

# 一个 ZIP 解压后全部条目的最大总大小 500 MiB，用于防止 ZIP Bomb。
max_zip_total_bytes: 524288000
# 修改目录只影响下一次启动所用路径，不搬迁/删除旧数据；修改大小限制不改变模型输入窗口。
