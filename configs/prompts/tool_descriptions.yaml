# 本文件每个顶层键必须与工具名一致，值为非空多行字符串，供bind_tools注入。
# 只改说明文本不能改变参数Schema/权限/返回字段，须同步app/tools相应类与测试。
# YAML #注释不进入模型；块字符串内的任何文字都会进入模型。修改后重启以刷新缓存。
# 通用检索：CommonTool，规则入库/资料入库/审核主子Agent使用；参数与返回见common_tools.py。
search_documents: |-
  用途：按问题检索，或沿真实chunk_id读取授权文档相邻原文、完整表格和图片入口。
  输入：querylist与chunklist必须且只能传一种非空列表，另一项省略或null，不传空数组。querylist每组含queries、file_ids；chunklist每组含chunk_id、before、after、file_id，四项必填，before/after为非负整数，file_id是单个授权文件ID。
  chunklist：沿指定文件当前冻结索引的原文顺序，返回中心及前后指定数量片段，不做向量召回或Rerank；中心始终保留，跨调用已读内容不排除。同文件同版本重叠窗口在本次调用内合并，非连续范围以分隔线分开，不补造中间内容。开头/末尾指当前索引边界，不保证等同物理文件起止。
  范围：有效file_ids以工具附加的授权列表为准；file_ids=null 使用下方声明的默认范围，不代表全库。文件身份与解析版本由系统绑定，不允许未来或越界文件。
  querylist当前检索配置：每个查询在每个检索范围内，向量召回与关键词召回各自最多取 ${candidate_top_k} 个候选，两路融合后的候选可能多于 ${candidate_top_k}；融合去重后交给 Rerank，最终最多返回 ${final_top_k} 个片段，不足时按实际数量返回。该配置不限制chunklist邻接读取。
  同组多个查询的命中按片段 ID 去重；跨查询、跨检索范围汇总后，整次工具调用可能超过 ${final_top_k} 个片段。这两个数量由服务端配置提供，不是工具入参。
  返回：Markdown。querylist分组列出查询、范围、状态、命中片段及真实位置、可看图路径；chunklist直接按原文顺序列出各片段，不回显正常请求汇总。
  各查询组独立返回范围和状态；范围拒绝、无命中、真实命中不同，调用正常返回不等于每组都取得片段。
  已展示正文的片段标题含真实chunk_id，需要引用时原样使用；正文未展示时不提供可引用ID。chunklist的文件名、位置及实际索引边界随每个片段展示；非法组报具体错误，不抹去其他合法组的实际返回。
  返回最终命中的完整片段，不按正文字符预算裁剪；完整片段不等于完整文件。无命中不代表无要求，失败会明确标记。
  当前文件的补查可能命中后续段落，不代表其已按批次处理，不推进阅读进度。

# 资料入库读写工具：app/tools/evidence_ingestion_tools.py；不是资料核验子Agent的工具。
save_evidence_material: |-
  用途：保存当前文件的完整双摘要和跨文件关系，或查看已完成历史文件的摘要；不生成审核结论。
  输入：material、file_ids 必须显式填写且恰好一项为 null。
  保存：material 包含 bid_summary（简洁摘要）、evidence_summary（详细摘要）、relations（关系列表），file_ids 为 null。三个字段均必填；字段名是 relations，每项为两项数组 [关系短语, 历史文件ID]，不是对象；无关系时填 []。保存完整覆盖当前文件的双摘要和关系，不是追加片段或只提交变化字段；目标文件由系统绑定，不修改其他文件。
  查看：material 为 null，file_ids 为已完成历史文件 ID 列表或字符串 "all"。只读范围是同批已完成历史文件；"all" 也不包括当前、未来、其他投标方文件。关系目标必须在该历史范围内，图片路径必须已登记。
  返回：Markdown 文件视图。保存返回实际已保存的当前完整结果；查看返回所选历史文件的完整双摘要和关系。
  只读不写库、不生成新摘要、不做向量检索；不另按历史摘要读取预算裁剪，所选历史文件的摘要与关系完整返回。
  错误：参数、历史范围或登记路径不合法时拒绝写入；执行中异常返回真实原因，不承诺所有异常均未落盘。读取成功不清除未解决的保存错误。

  以下仅演示合法参数，事实与ID不是当前任务数据。短摘要不规定实际摘要长度，实际保存应保留完整已知事实。
  示例1——保存当前文件，无关系（假设样例原文仅有以下交付事实）：
  {"material":{"bid_summary":"交付台账，记载本批交付数量。","evidence_summary":"台账记载本批交付数量为12件；本文件未载明验收结果。","relations":[]},"file_ids":null}
  示例2——保存当前文件，有关系（假设当前为file-2，历史file-1已完成，且原文已确认它是同批次验收记录）：
  {"material":{"bid_summary":"交付台账，可与同批验收记录对应。","evidence_summary":"交付台账与历史验收记录具有相同批次标识，可联合查看交付和验收事实。","relations":[["同批次验收记录","file-1"]]},"file_ids":null}
  示例3——查看已完成的历史file-1，不保存当前文件：
  {"material":null,"file_ids":["file-1"]}

# 通用看图：CommonTool，按已登记路径和当前作用域校验；不是parser_vision_model解析调用。
view_image: |-
  用途：直接查看授权材料中的图片、扫描页或表格回查图，核实转写不足或关键视觉信息。
  范围：只读取当前授权文件、固定解析版本中已登记的实际图片入口；不接受 URL 或本地绝对路径，不按文件ID或页码生成图片。
  授权范围错误表示此会话无读取权；未登记错误表示该入口不在指定解析结果中；两者都没有成功返回图片。
  返回：包含真实图片的多模态工具消息及必要来源说明，不会额外调用识图模型。
  读取失败只返回真实原因，不代表图片本身不可读，也不能据此判定材料不存在。

rule_candidates: |-
  用途：查看和编辑当前文件唯一的候选Markdown草稿，不直接修改正式规则库。
  输入：仅action和edits。action为read、edit或finish。read/finish的edits省略或null；edit传非空old_text/new_text列表，顺序精确替换，new_text为空表示删除。不提供write或content参数。
  初稿：新文件的候选稿为空字符串；仅当前稿为空时，old_text填空字符串、new_text填完整首稿。已有正文时old_text须唯一精确匹配，不能用空字符串覆盖或追加。草稿结构按System约定，格式示例和状态提示不属于当前稿。
  返回：edit仅返回简短保存状态、结构校验及阶段信息，不回显变化文本或全稿；read返回当前完整草稿。匹配失败返回首个失败项、总项数和命中次数；按前项替换后的内存稿匹配，任一失败则整批不保存，前项也不落盘。文本保存后结构仍有问题会返回具体错误，供继续编辑，只有一份当前稿。
  交接：仅finish检查当前稿及未解决编辑错误，通过并保存阶段后进入合并；成功返回完整草稿及已有规则，下轮切换工具。失败保持提取和当前稿，edit不隐式结束，正文宣告不切阶段。
  生命周期：同文件分批保留当前稿，成功处理完切下一文件时重置，不保存候选历史。

# 规则入库增量读写：app/tools/rule_tools.py；参数验证/保存语义由代码维护。
submit_rule_delta: |-
  用途：原子保存当前文件有依据的规则增量及项目简介，或只读查看当前规则库。
  契约：三个参数必须显式填写；只读时全部为 null，写入须至少更新规则或简介之一，并指定 changed/all。操作字段含义以参数 Schema 为准；ID 及来源合并由系统维护。
  project_profile是用于相关性路由的完整项目简介，包含有依据的项目身份和采购范围，不是本批执行进度或抽取统计；没有简介更新时填null，更新时保留仍成立的项目信息。
  add提交新主题；merge的requirement只写新增内容，由系统追加，仅补来源时可省略，merged_rule_ids用于吸收已有规则。add/merge不填来源列表；replace提交更正后完整字段和完整source_file_ids。每次写规则的reason均为更新后完整说明，直接覆盖而非追加，无额外说明可显式填空字符串，不可省略或为null。
  空值兼容：add的rule_id、merged_rule_ids、source_file_ids为null时等同省略；merge的merged_rule_ids为null时等同空列表、source_file_ids为null时等同省略；replace的merged_rule_ids为null时等同省略。其他必填值、真实ID和来源列表仍按原契约校验，不丢弃非空非法字段。
  只读示例：{"operations":null,"project_profile":null,"return_view":null}。
  只更新简介并查看全库：{"operations":null,"project_profile":"更新后的完整简介","return_view":"all"}。
  all 是真实写入后的返回范围，不是查看命令。
  返回：成功时仅返回渲染后的 Markdown 规则视图，不是 JSON。
  changed 返回整批最终新增或修改的全部存续规则及已更新简介，all 返回当前完整规则库。
  视图含规则 ID、等级、正文、来源文件 ID、依据说明，不含维护标记。
  错误：参数或业务校验不通过时整批不写入，错误指出操作及原因；执行中异常不承诺未落盘。只读失败不会清除未解决的提交错误，候选变更不等于成功保存。

# 主审核 Agent：每项共同事实可关联多条规则，最终仍逐规则判断。
# 主审核委派子Agent：app/tools/bid_tools.py；权限和资料范围由状态确定，不由描述授权。
request_evidence_review: |-
  用途：将明确的资料事实核验事项交给子Agent。子Agent收到起始文件及一层直接关系范围内的详细摘要，可在该授权范围检索原文、查看图片及使用沙箱处理数据，返回事实与支持情况，不写正式报告。
  输入与范围：checks中每项关联一条或多条当前冻结规则。rule_ids仅供系统关联，判断标准和必须返回的事实写在verification_request；file_ids指定所选资料库内的起始文件。每项独立子会话，项间不自动共享结果，不无限扩展关系。
  每个check仅含rule_ids、verification_request、file_ids，三项均必填。补充说明写入verification_request正文，不增加verification_request_note、note等额外键。
  子会话不读取招标或当前投标原件；verification_request可承接主审提供的标准和事实，但不扩大原件权限。rule_ids来自当前冻结规则，file_ids来自当前资料目录。
  返回：按checks顺序返回，系统标题包含check序号及关联rule_ids，随后为子核验正文。正文含对象/版本、必要事实、依据类型、实际计算结果或待计算项及限制；摘要依据标明文件，实际读取并采用的原文/图片才附真实来源键。完整原请求不重复回显，不回传子Agent全部聊天历史。
  错误：整批身份预检在启动子会话前执行，任一check身份非法则本批均未启动；当前身份错误不提供逐check及全部非法ID的定位列表。运行中子会话失败前的其他check可能已执行；执行失败不等于材料缺失、未提交或核验不通过。

  以下仅演示参数形态，假设rule-1、rule-2是当前冻结规则，file-1是本次授权资料；实际ID和事实取自当前输入，不照抄样例。
  示例——请求两条判断共用的交付与验收事实：
  {"checks":[{"rule_ids":["rule-1","rule-2"],"verification_request":"对象：本批交付记录及对应验收记录。已有事实与依据：主审已核对规则要求，交付与验收须对应同一批次。必须返回：记录标识、版本、交付及验收登记的原填数量、依据类型和缺项；只返回资料侧事实，不代替主审给两条规则下结论。","file_ids":["file-1"]}]}

# CommonTool统一提供给四类业务Agent；不是宿主终端，不开放给路由/视觉/压缩模型。
run_python: |-
  用途：沙箱工具，在独立执行环境处理已经取得的数据，可做文本/正则/JSON处理、筛选排序、集合去重/比对、简单算法、数值及日期计算；不是宿主终端，不读取外部材料、不写业务库或报告。
  输入：只有code字符串，不加Markdown围栏。数据写入代码，使用print输出；每次独立进程、无持久状态，不共享上次调用的变量或文件，不安装依赖。
  可用：常规表达式、同步函数和循环，以及math、decimal、datetime、statistics、collections、itertools、json、re、string中实际开放的成员，不是整库任意能力。常用示例包括Decimal、date/timedelta、Counter、json.loads/dumps和re.findall。精确小数可用十进制字符串构造Decimal，字符串插值可用f-string。
  禁止：文件/数据库读写、网络、系统命令/子进程、环境变量及非白名单导入；open/eval/exec/compile等动态或外部能力；私有属性和反射、format/format_map方法、属性赋值或删除。当前也不支持class、async/await、with、global、nonlocal。
  命名限制：当前预检拒绝下划线开头的变量、函数、形参和导入别名，单独的占位变量_也不支持；可用item、row等普通名称。该限制不代表所处理的数据本身有问题。
  返回：只含status和result。success的result为实际标准输出，无print则为空；error的result为预检、运行或资源限制的真实原因，失败前的部分输出不算成功结果。语法、类型等错误可按报错修正代码，权限拒绝表示超出当前能力；环境不可用须如实交代。执行前检查代码，执行有代码大小、时间、输出等资源上限，拒绝或超限均返回error并说明原因。

  以下仅演示输入输出形态，样例数据不是业务事实，实际输入和处理口径来自当前任务。
  示例1——解析JSON、去重并排序：
  {"code":"import json\nrecords = json.loads('[3, 1, 3]')\nprint(sorted(set(records)))"}
  预期返回：
  {"status":"success","result":"[1, 3]\n"}
  示例2——精确小数处理：
  {"code":"from decimal import Decimal\nvalues = [Decimal('0.1'), Decimal('0.2')]\nprint(sum(values))"}
  预期返回：
  {"status":"success","result":"0.3\n"}

# 主审核报告读写：app/tools/report_tools.py；报告模板单独在templates/audit_report_template.md。
report_document: |-
  作用：读取、完整写入或精确编辑当前投标文件的唯一报告。路径由系统绑定，不能访问其他文件。
  状态：新草稿区分待保存、已记录未完成、已完成及格式待修；待保存仅作提醒，不限制其他授权工具，也不单独阻止会话结束。read只查看；后续write/edit成功落盘才检查关联规则的当前状态、进度说明及已填内容，不核对本次修改范围，不强制来源非空。状态落盘失败不算成功；内部进度不进入正式报告。
  契约：action、content、edits 均须显式填写。read 时 content、edits 均为 null；write 时 content 为完整报告、edits 为 null；edit 时 content 为 null、edits 为非空列表。write 是整稿覆盖，edit 是整批按顺序精确替换，old_text 须唯一命中。报告正文格式由 System 独立报告模板约定，不由工具补写结论。
  返回：成功读取或完成文本保存后，先返回“当前草稿状态”（已填写进度、缺项或具体校验错误），再返回read的完整当前草稿或write/edit的简短保存回执；不返回变更正文。状态首部与分隔文字不属于草稿，不写入正文，也不能作为edit的old_text。内容格式或引用校验未通过仍保存草稿，继续 edit 修正；未通过校验不能定稿。参数错误、old_text 未命中/不唯一时整批不保存；磁盘错误不算成功。不模糊匹配，不维护待修/有效两份版本。
  缺失固定分类标题仅在冻结规则集合与顺序完整且归属唯一时由代码补齐。执行中异常不能承诺未落盘，以当前稿和实际校验状态为准。
  每个 edit 都必须包含 old_text 和 new_text。old_text 逐字取自当前稿，保留引号、空白和换行，包含足够上下文以唯一定位，不以语义相近的改写替代。new_text 仅替换该范围，空字符串表示删除。若new_text包含原稿已有的章节标题，相应原区块也须纳入替换范围，避免留下重复标题。多个已有区块可在同次edit分别替换；已修改过的区块按最新正文定位，不能继续匹配旧占位，不能只拿多处重复的“待填写。”作old_text。
  多项按数组顺序作用于内存候选稿，后项需考虑前项已产生的变化；任一匹配失败时整批不保存。匹配失败的错误指出首个失败项、总项数和实际命中次数，区分零命中与多命中；不是报告正文的业务校验结果。
  保存成功表示内容落盘，不代表校验通过；标题错误可能只报告首个差异或通用缺失／多余，不保证给出完整根因。

  以下示例仅演示调用方法，不是本次文件事实，也不是要求依次执行。实际调用使用当前稿与真实已确认内容。
  示例1——只读当前稿：
  {"action":"read","content":null,"edits":null}
  示例2——假设当前稿有以下两个相邻区块，其余明细已确认符合且保持不变：
  ## 总体总结

  待填写。

  ## 重点问题

  待填写。

  同次分别替换两块，每项均有old_text和new_text，保留每个标题各一份：
