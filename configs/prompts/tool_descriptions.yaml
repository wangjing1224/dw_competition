# 主审核 Agent：按当前 RuleItem 检索当前投标文件中的响应。
search_bid_response: >-
  当投标摘要不足以判断重点规则时，使用一个或多个精确 query 检索当前投标文件原文。
  query 可包含规则 requirement 中的关键术语、产品型号、参数、主体或具体疑问。

# 主审核 Agent：规则要求或适用范围不清楚时检索招标原文。
search_tender_source: >-
  使用一个或多个精确 query 检索当前项目招标文件原文；仅在规则要求、适用范围或重要性
  不能从精简规则中确认时调用。

# 主审核 Agent：把单条明确核验任务交给资料核验子 Agent。
request_evidence_review: >-
  为一条规则启动资料核验。填写 rule_id、明确的 verification_request 和单个 evidence_type；
  当前任务身份和可用资料由系统注入。

# 资料核验子 Agent：按系统注入的投标方和资料类型检索原文。
search_evidence: >-
  使用一个或多个精确 query 检索当前核验任务允许的资料原文；可以用 file_ids 进一步限制
  文件。返回的 chunks 才是可用于结论的证据。
