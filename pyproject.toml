[project]
name = "dw-competition"
version = "0.1.0"
description = "基于 LangChain/LangGraph 的电力招投标文件智能审核系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.4.7",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "langsmith>=0.8.18",
    "markdown-it-py>=4.0,<5",
    "modelscope>=1.37.1",
    "numpy>=2.4.6",
    "olefile>=0.47,<0.48",
    "openpyxl>=3.1.5",
    "pillow>=11.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rarfile>=4.2,<5",
    "sentence-transformers>=5.6.0",
    "tokenizers>=0.22.0",
    "transformers>=4.51.0",
    "uvicorn[standard]>=0.49.0",
    "xlrd>=2.0.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
